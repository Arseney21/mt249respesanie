<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Расписание НКПТ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #000000);
    --hint: var(--tg-theme-hint-color, #999999);
    --link: var(--tg-theme-link-color, #2481cc);
    --btn: var(--tg-theme-button-color, #2481cc);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --secondary: var(--tg-theme-secondary-bg-color, #f0f0f0);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 16px 12px 80px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin-bottom: 16px;
  }
  .group-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--secondary); border: none; color: var(--text);
    padding: 8px 14px; border-radius: 20px; font-size: 16px; font-weight: 600;
    cursor: pointer;
  }
  .group-btn::after { content: "▾"; font-size: 12px; color: var(--hint); }
  .updated { font-size: 12px; color: var(--hint); }
  .day {
    background: var(--secondary); border-radius: 14px;
    padding: 12px 14px; margin-bottom: 10px;
  }
  .day-title { font-weight: 700; margin-bottom: 8px; }
  .day-title .date { font-weight: 400; color: var(--hint); margin-left: 6px; }
  .lesson {
    display: grid; grid-template-columns: 28px 60px 1fr; gap: 8px;
    padding: 6px 0; border-top: 1px solid rgba(127,127,127,.15);
    font-size: 14px; line-height: 1.35;
  }
  .lesson:first-of-type { border-top: none; }
  .lesson .num { color: var(--hint); font-weight: 600; }
  .lesson .time { color: var(--hint); font-size: 12px; }
  .lesson .subj { font-weight: 500; }
  .lesson .room { color: var(--link); font-size: 12px; }
  .empty { color: var(--hint); padding: 12px 0; }
  /* шторка */
  .sheet-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.45);
    display: none; align-items: flex-end; z-index: 100;
  }
  .sheet-backdrop.open { display: flex; }
  .sheet {
    width: 100%; max-height: 80vh; background: var(--bg);
    border-radius: 18px 18px 0 0; padding: 14px;
    display: flex; flex-direction: column;
  }
  .sheet h3 { margin: 0 0 10px; font-size: 18px; }
  .sheet input {
    width: 100%; padding: 10px 12px; border-radius: 10px;
    border: 1px solid rgba(127,127,127,.3); background: var(--secondary);
    color: var(--text); font-size: 15px; margin-bottom: 10px;
  }
  .group-list { overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .group-item {
    padding: 12px 10px; border-radius: 10px; cursor: pointer;
    display: flex; justify-content: space-between; align-items: center;
  }
  .group-item:hover, .group-item.active { background: var(--secondary); }
  .group-item.active::after { content: "✓"; color: var(--link); font-weight: 700; }
  .group-item.hidden { display: none; }
</style>
</head>
<body>

<header>
  <button class="group-btn" id="groupBtn">Загрузка…</button>
  <span class="updated" id="updated"></span>
</header>

<main id="content"><div class="empty">Загрузка расписания…</div></main>

<div class="sheet-backdrop" id="backdrop">
  <div class="sheet">
    <h3>Выберите группу</h3>
    <input id="search" placeholder="Поиск…" autocomplete="off">
    <div class="group-list" id="groupList"></div>
  </div>
</div>

<script>
(function () {
  const STORAGE_KEY = "nkpt_group";
  const DATA_URL = "schedule.json";

  let data = null;          // полный json
  let groups = [];          // массив имён групп
  let current = null;       // выбранная группа

  const $groupBtn = document.getElementById("groupBtn");
  const $content  = document.getElementById("content");
  const $updated  = document.getElementById("updated");
  const $backdrop = document.getElementById("backdrop");
  const $groupList= document.getElementById("groupList");
  const $search   = document.getElementById("search");

  function normalize(raw) {
    // Поддержка нового формата (version 2) и старого (один объект с days)
    if (raw && Array.isArray(raw.groups) && raw.schedules) {
      return { groups: raw.groups, schedules: raw.schedules, fetchedAt: raw.fetchedAt };
    }
    // старый формат: { group: "МТ-24/9", days: [...] } или массив дней
    let legacyName = "МТ-24/9";
    let legacyDays = [];
    if (Array.isArray(raw)) legacyDays = raw;
    else if (raw && Array.isArray(raw.days)) {
      legacyDays = raw.days;
      if (raw.group) legacyName = raw.group;
    }
    return {
      groups: [legacyName],
      schedules: { [legacyName]: { group: legacyName, days: legacyDays } },
      fetchedAt: null,
    };
  }

  async function load() {
    try {
      const res = await fetch(DATA_URL + "?t=" + Date.now());
      if (!res.ok) throw new Error("HTTP " + res.status);
      const raw = await res.json();
      data = normalize(raw);
      groups = data.groups || [];
    } catch (e) {
      $content.innerHTML = '<div class="empty">Не удалось загрузить расписание: ' + e.message + '</div>';
      return;
    }

    if (!groups.length) {
      $content.innerHTML = '<div class="empty">Список групп пуст.</div>';
      return;
    }

    let saved = null;
    try { saved = localStorage.getItem(STORAGE_KEY); } catch (_) {}
    current = (saved && groups.includes(saved)) ? saved : groups[0];

    renderGroupList();
    render();
  }

  function renderGroupList() {
    $groupList.innerHTML = "";
    groups.forEach(function (g) {
      const div = document.createElement("div");
      div.className = "group-item" + (g === current ? " active" : "");
      div.dataset.group = g;
      div.textContent = g;
      div.addEventListener("click", function () { select(g); });
      $groupList.appendChild(div);
    });
  }

  function select(g) {
    current = g;
    try { localStorage.setItem(STORAGE_KEY, g); } catch (_) {}
    $groupBtn.textContent = g;
    closeSheet();
    render();
  }

  function render() {
    $groupBtn.textContent = current;
    if (data.fetchedAt) {
      const d = new Date(data.fetchedAt);
      $updated.textContent = "обновлено " + d.toLocaleString("ru-RU", {
        day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit"
      });
    } else {
      $updated.textContent = "";
    }

    const sched = data.schedules[current];
    if (!sched || !Array.isArray(sched.days) || !sched.days.length) {
      $content.innerHTML = '<div class="empty">Для этой группы расписание пока не загружено.</div>';
      return;
    }

    let html = "";
    sched.days.forEach(function (day) {
      if (!day.lessons || !day.lessons.length) return;
      html += '<section class="day">';
      html += '<div class="day-title">' + esc(day.weekday || "") +
              (day.date ? '<span class="date">' + esc(day.date) + '</span>' : "") + '</div>';
      day.lessons.forEach(function (l) {
        const time = l.time ? '<span class="time">' + esc(l.time) + '</span>' : "";
        const room = l.room ? '<span class="room">ауд. ' + esc(l.room) + '</span>' : "";
        const sub  = l.subgroup ? '<div class="time">подгр. ' + esc(l.subgroup) + '</div>' : "";
        html += '<div class="lesson">' +
                  '<div class="num">' + esc(l.num || "") + '</div>' +
                  '<div>' + time + '</div>' +
                  '<div><div class="subj">' + esc(l.subject || "") + '</div>' +
                       room + sub + '</div>' +
                '</div>';
      });
      html += '</section>';
    });
    $content.innerHTML = html || '<div class="empty">Пар нет.</div>';
  }

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function openSheet() {
    $backdrop.classList.add("open");
    $search.value = "";
    Array.from($groupList.children).forEach(function (el) { el.classList.remove("hidden"); });
    setTimeout(function () { $search.focus(); }, 100);
  }
  function closeSheet() { $backdrop.classList.remove("open"); }

  $groupBtn.addEventListener("click", openSheet);
  $backdrop.addEventListener("click", function (e) {
    if (e.target === $backdrop) closeSheet();
  });
  $search.addEventListener("input", function () {
    const q = $search.value.trim().toLowerCase();
    Array.from($groupList.children).forEach(function (el) {
      const g = el.dataset.group.toLowerCase();
      el.classList.toggle("hidden", q && g.indexOf(q) === -1);
    });
  });

  // инициализация Telegram
  if (window.Telegram && window.Telegram.WebApp) {
    try { window.Telegram.WebApp.ready(); window.Telegram.WebApp.expand(); } catch (_) {}
  }

  load();

  // автообновление раз в 5 минут
  setInterval(load, 5 * 60 * 1000);
})();
</script>
</body>
</html>
