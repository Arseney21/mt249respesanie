<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Расписание МТ-24/9</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:var(--tg-theme-secondary-bg-color,#F2F2F7);
  --card:var(--tg-theme-section-bg-color,var(--tg-theme-bg-color,#FFFFFF));
  --text:var(--tg-theme-text-color,#1C1C1E);
  --hint:var(--tg-theme-hint-color,#7D7A75);
  --accent:var(--tg-theme-button-color,#2783DE);
  --accent-text:var(--tg-theme-button-text-color,#FFFFFF);
  --line:rgba(127,127,127,.16);
  --soft:color-mix(in srgb,var(--accent) 12%,transparent);
  --green:#34A853; --orange:#E8892F;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root{--bg:var(--tg-theme-secondary-bg-color,#111113);--card:var(--tg-theme-section-bg-color,var(--tg-theme-bg-color,#1C1C1E));--text:var(--tg-theme-text-color,#FFFFFF);--hint:var(--tg-theme-hint-color,rgba(255,255,255,.6));--accent:var(--tg-theme-button-color,#5E9FE8)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px calc(32px + env(safe-area-inset-bottom))}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:4px 4px 16px}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--hint)}
h1{margin:2px 0 0;font-size:28px;line-height:1.15;font-weight:750;letter-spacing:-.02em}
.badge{flex:none;font-size:13px;font-weight:600;color:var(--accent);background:var(--soft);padding:6px 10px;border-radius:999px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border-radius:12px;padding:4px;margin-bottom:12px;border:1px solid var(--line)}
.seg button{all:unset;cursor:pointer;text-align:center;font-size:14px;font-weight:600;padding:9px 0;border-radius:9px;color:var(--hint);transition:background .2s,color .2s}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-text)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:16px}
.day{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0 8px;border-radius:12px;background:var(--card);border:1px solid var(--line);position:relative;min-height:44px}
.day .dw{font-size:12px;font-weight:600;color:var(--hint);text-transform:uppercase}
.day .dn{font-size:18px;font-weight:700}
.day .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);opacity:.9}
.day .dot.off{opacity:0}
.day.today .dn{color:var(--accent)}
.day[aria-selected=true]{background:var(--accent);border-color:var(--accent)}
.day[aria-selected=true] .dw,.day[aria-selected=true] .dn{color:var(--accent-text)}
.day[aria-selected=true] .dot{background:var(--accent-text)}
.day:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px 8px}
.dayhead h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.dayhead span{font-size:14px;color:var(--hint)}
.now{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;border:1px solid var(--line);position:relative;overflow:hidden}
.now .lbl{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.now .lbl i{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px color-mix(in srgb,var(--green) 20%,transparent)}
.now.next .lbl i{background:var(--orange);box-shadow:0 0 0 4px color-mix(in srgb,var(--orange) 20%,transparent)}
.now .lbl{color:var(--green)} .now.next .lbl{color:var(--orange)}
.now .t{font-size:17px;font-weight:650;margin:6px 0 2px}
.now .s{font-size:14px;color:var(--hint)}
.bar{height:6px;border-radius:6px;background:var(--line);margin-top:12px;overflow:hidden}
.bar b{display:block;height:100%;background:var(--green);border-radius:6px}
.list{display:flex;flex-direction:column;gap:10px}
.pair{display:grid;grid-template-columns:56px 1fr;gap:12px;background:var(--card);border-radius:var(--r);padding:14px 16px 14px 12px;border:1px solid var(--line)}
.pair.live{border-color:var(--green);box-shadow:inset 3px 0 0 var(--green)}
.pair.past{opacity:.55}
.tm{display:flex;flex-direction:column;align-items:center;padding-top:2px}
.num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700;background:var(--soft);color:var(--accent);margin-bottom:6px}
.tm .a{font-size:14px;font-weight:650}
.tm .b{font-size:13px;color:var(--hint)}
.les+.les{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.subj{font-size:16px;font-weight:650;line-height:1.3}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:6px;font-size:14px;color:var(--hint)}
.meta span{display:inline-flex;align-items:center;gap:5px}
.meta svg{width:15px;height:15px;flex:none;opacity:.8}
.tag{font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--line);color:var(--text);margin-left:6px;vertical-align:2px}
.gap{text-align:center;font-size:13px;color:var(--hint);padding:2px 0}
.empty{background:var(--card);border-radius:var(--r);padding:40px 16px;text-align:center;border:1px solid var(--line)}
.empty .e{font-size:44px;line-height:1}
.empty h3{margin:12px 0 4px;font-size:18px}
.empty p{margin:0;color:var(--hint);font-size:14px}
footer{margin-top:20px;text-align:center;font-size:13px;color:var(--hint)}
footer a{color:var(--hint)}
.skel{height:84px;border-radius:var(--r);background:linear-gradient(90deg,var(--card),var(--line),var(--card));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:360px){.days{gap:4px}.day .dn{font-size:16px}.pair{grid-template-columns:48px 1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><div class="eyebrow">Расписание</div><h1 id="group">МТ-24/9</h1></div>
    <div class="badge" id="weekBadge" hidden></div>
  </header>
  <div class="seg" role="group" aria-label="Неделя">
    <button id="w0" aria-pressed="true">Эта неделя</button>
    <button id="w1" aria-pressed="false">Следующая</button>
  </div>
  <nav class="days" id="days" role="tablist" aria-label="Дни недели"></nav>
  <div class="dayhead"><h2 id="dayTitle">Загрузка…</h2><span id="daySub"></span></div>
  <div id="now"></div>
  <main class="list" id="list"><div class="skel"></div><div class="skel"></div><div class="skel"></div></main>
  <footer id="foot"></footer>
</div>
<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); try{ tg.setHeaderColor('secondary_bg_color'); tg.setBackgroundColor('secondary_bg_color'); }catch(e){} }
const haptic = () => { try{ tg?.HapticFeedback?.selectionChanged(); }catch(e){} };

const TZ = 'Asia/Novosibirsk';
const WD = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const WD_FULL = ['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
const MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const ICON = {
  room:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
  teacher:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>'
};
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// «Сейчас» в Новосибирске (для теста: ?now=2026-11-06T10:30)
function nowNsk(){
  const q = new URLSearchParams(location.search).get('now');
  if (q) { const [d,t='00:00'] = q.split('T'); return {date:d, min:toMin(t)}; }
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date()).map(x=>[x.type,x.value]));
  return {date:`${p.year}-${p.month}-${p.day}`, min:+p.hour*60 + +p.minute};
}
const toMin = t => { const [h,m] = t.split(':'); return +h*60 + +m; };
const fmtLeft = m => m >= 60 ? `${Math.floor(m/60)} ч ${m%60} мин` : `${m} мин`;
const dObj = iso => new Date(iso + 'T12:00:00');
const wdIdx = iso => (dObj(iso).getDay() + 6) % 7;

let DATA, weeks = [], state = {w:0, i:0};

async function load(){
  try {
    const r = await fetch('schedule.json?t=' + Date.now(), {cache:'no-store'});
    if (!r.ok) throw new Error(r.status);
    DATA = await r.json();
    localStorage.setItem('sched', JSON.stringify(DATA));
  } catch(e) {
    const c = localStorage.getItem('sched');
    if (!c) { document.getElementById('list').innerHTML = '<div class="empty"><div class="e">📡</div><h3>Нет связи</h3><p>Не удалось загрузить расписание. Попробуйте позже.</p></div>'; document.getElementById('dayTitle').textContent=''; return; }
    DATA = JSON.parse(c); DATA._offline = true;
  }
  init();
}

function init(){
  document.getElementById('group').textContent = DATA.group;
  for (let k = 0; k < DATA.days.length; k += 7) weeks.push(DATA.days.slice(k, k+7));
  const today = nowNsk().date;
  let w = weeks.findIndex(wk => wk.some(d => d.date === today));
  if (w < 0) w = today < DATA.days[0].date ? 0 : weeks.length - 1;
  const i = Math.max(0, weeks[w].findIndex(d => d.date === today));
  state = {w, i: weeks[w].some(d=>d.date===today) ? i : 0};
  // Кнопки недель: «Эта/Следующая», если сегодня внутри данных; иначе «Неделя 1/2»
  const inside = weeks.some(wk => wk.some(d => d.date === today));
  ['w0','w1'].forEach((id,k) => {
    const b = document.getElementById(id);
    if (!weeks[k]) { b.hidden = true; return; }
    const wk = weeks[k], a = dObj(wk[0].date), z = dObj(wk[wk.length-1].date);
    b.textContent = inside ? (k === w ? 'Эта неделя' : (k < w ? 'Прошлая' : 'Следующая')) : `${a.getDate()}.${String(a.getMonth()+1).padStart(2,'0')} – ${z.getDate()}.${String(z.getMonth()+1).padStart(2,'0')}`;
    b.onclick = () => { if (state.w === k) return; haptic(); state.w = k; state.i = Math.min(state.i, weeks[k].length-1); render(); };
  });
  const f = document.getElementById('foot');
  f.innerHTML = `${DATA._offline ? 'Офлайн-копия · ' : ''}Сайт обновлён ${esc(DATA.siteUpdated || '—')} · <a href="${esc(DATA.source)}" target="_blank" rel="noopener">источник</a>`;
  setupSwipe();
  render();
  setInterval(render, 30000);
}

function render(){
  const wk = weeks[state.w], day = wk[state.i], now = nowNsk();
  document.getElementById('w0').setAttribute('aria-pressed', state.w === 0);
  document.getElementById('w1').setAttribute('aria-pressed', state.w === 1);
  const badge = document.getElementById('weekBadge');
  badge.hidden = false; badge.textContent = `Неделя ${day.week}`;

  document.getElementById('days').innerHTML = wk.map((d,k) => {
    const has = d.pairs.some(p => p.lessons.length);
    return `<button class="day${d.date===now.date?' today':''}" role="tab" aria-selected="${k===state.i}" data-k="${k}" aria-label="${WD_FULL[wdIdx(d.date)]}, ${dObj(d.date).getDate()}${has?'':' — нет пар'}">
      <span class="dw">${WD[wdIdx(d.date)]}</span><span class="dn">${dObj(d.date).getDate()}</span><span class="dot${has?'':' off'}"></span></button>`;
  }).join('');
  document.querySelectorAll('.day').forEach(b => b.onclick = () => { const k = +b.dataset.k; if (k===state.i) return; haptic(); state.i = k; render(); });

  const dt = dObj(day.date);
  const rel = day.date === now.date ? 'Сегодня' : (daysBetween(now.date, day.date) === 1 ? 'Завтра' : (daysBetween(now.date, day.date) === -1 ? 'Вчера' : WD_FULL[wdIdx(day.date)]));
  document.getElementById('dayTitle').textContent = rel;
  document.getElementById('daySub').textContent = `${rel === WD_FULL[wdIdx(day.date)] ? '' : WD_FULL[wdIdx(day.date)].toLowerCase() + ', '}${dt.getDate()} ${MONTHS[dt.getMonth()]}`;

  const pairs = day.pairs.filter(p => p.lessons.length);
  const isToday = day.date === now.date, isPast = day.date < now.date;
  renderNow(isToday ? pairs : [], now.min);

  const list = document.getElementById('list');
  if (!pairs.length) {
    list.innerHTML = `<div class="empty"><div class="e">${wdIdx(day.date) >= 5 ? '🌿' : '🎉'}</div><h3>Пар нет</h3><p>Можно отдохнуть или заняться своими делами</p></div>`;
    return;
  }
  let html = '', prev = null;
  for (const p of pairs) {
    if (prev && p.num - prev.num > 1) html += `<div class="gap">окно · ${p.num - prev.num - 1} ${p.num - prev.num - 1 === 1 ? 'пара' : 'пары'}</div>`;
    const [a,b] = p.time || ['—','—'];
    const st = isPast ? 'past' : (isToday && p.time ? (now.min >= toMin(b) ? 'past' : (now.min >= toMin(a) ? 'live' : '')) : '');
    html += `<article class="pair ${st}">
      <div class="tm"><div class="num">${p.num}</div><div class="a">${a}</div><div class="b">${b}</div></div>
      <div>${p.lessons.map(l => `<div class="les">
        <div class="subj">${esc(cap(l.subject))}${l.type ? `<span class="tag">${esc(l.type)}</span>` : ''}${l.subgroup ? `<span class="tag">${l.subgroup} подгр.</span>` : ''}</div>
        <div class="meta">${l.room ? `<span>${ICON.room}${esc(l.room)}</span>` : ''}${l.teacher ? `<span>${ICON.teacher}${esc(l.teacher)}</span>` : ''}</div>
      </div>`).join('')}</div></article>`;
    prev = p;
  }
  list.innerHTML = html;
}

function renderNow(pairs, m){
  const box = document.getElementById('now');
  const live = pairs.find(p => p.time && m >= toMin(p.time[0]) && m < toMin(p.time[1]));
  const next = pairs.find(p => p.time && m < toMin(p.time[0]));
  if (live) {
    const s = toMin(live.time[0]), e = toMin(live.time[1]), pct = Math.round((m - s) / (e - s) * 100);
    box.innerHTML = `<section class="now"><div class="lbl"><i></i>Идёт ${live.num}-я пара</div><div class="t">${esc(cap(live.lessons[0].subject))}</div><div class="s">До конца ${fmtLeft(e - m)}${live.lessons[0].room ? ' · ауд. ' + esc(live.lessons[0].room) : ''}</div><div class="bar"><b style="width:${pct}%"></b></div></section>`;
  } else if (next) {
    box.innerHTML = `<section class="now next"><div class="lbl"><i></i>Далее · через ${fmtLeft(toMin(next.time[0]) - m)}</div><div class="t">${esc(cap(next.lessons[0].subject))}</div><div class="s">${next.num}-я пара в ${next.time[0]}${next.lessons[0].room ? ' · ауд. ' + esc(next.lessons[0].room) : ''}</div></section>`;
  } else box.innerHTML = '';
}

function cap(s){ // «УЧЕБНАЯ ПРАКТИКА УП 04» → «Учебная практика УП 04»
  if (s === s.toUpperCase() && /[А-ЯЁ]{4,}/.test(s)) s = s.toLowerCase().replace(/(^|\s)(уп|пп|мдк|пм)(?=\s|$)/g, (x,a,b)=>a+b.toUpperCase());
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function daysBetween(a,b){ return Math.round((dObj(b) - dObj(a)) / 864e5); }

function setupSwipe(){
  let x0 = null, y0 = null;
  const el = document.querySelector('.wrap');
  el.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive:true});
  el.addEventListener('touchend', e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
    if (Math.abs(dx) < 60 || Math.abs(dy) > Math.abs(dx)) return;
    const dir = dx < 0 ? 1 : -1; let {w,i} = state; i += dir;
    if (i < 0) { if (w === 0) return; w--; i = weeks[w].length - 1; }
    if (i >= weeks[w].length) { if (w === weeks.length - 1) return; w++; i = 0; }
    haptic(); state = {w,i}; render();
  }, {passive:true});
}
load();
</script>
</body>
</html>
