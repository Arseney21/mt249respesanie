name: Обновление расписания
on:
  schedule:
    - cron: "*/30 * * * *"   # каждые 30 минут
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install beautifulsoup4 lxml
      - run: python scraper.py
      - name: Сохранить, если расписание изменилось
        run: |
          git config user.name "schedule-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/schedule.json
          git diff --cached --quiet -I '"fetchedAt"' || (git commit -m "Обновлено расписание" && git push)
